kind = "web"
previewPath = "/"
title = "Ninh Studio"
version = "1.0.0"
id = "artifacts/ninh-studio"
router = "path"

[[integratedSkills]]
name = "nextjs"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3000

[services.development]
run = "pnpm --filter @workspace/ninh-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ninh-studio", "run", "build" ]
run = "pnpm --filter @workspace/ninh-studio run start"

[services.env]
PORT = "3000"
